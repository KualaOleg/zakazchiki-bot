name: watch-channels

# Бот работает «цепочкой»: каждый запуск несколько часов подряд проверяет каналы раз в 30 минут,
# а в конце сам запускает следующий круг. Расписание — только подстраховка, если цепочка оборвётся
# (GitHub часто пропускает запуски по расписанию). Остановить бота: Actions → watch-channels → Disable workflow.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Сколько часов работать в этом круге (0 — одна проверка)"
        required: false
        default: "5"

permissions:
  contents: write
  actions: write

concurrency:
  group: watch-channels
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверять каналы раз в 30 минут
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOURS: ${{ inputs.hours || '5' }}
        run: |
          git config user.name "lead-bot"
          git config user.email "lead-bot@users.noreply.github.com"
          end=$(( $(date +%s) + ${HOURS%%.*} * 3600 ))
          while :; do
            echo "::group::Проверка $(date -u +%H:%M) UTC"
            python watch_channels.py || echo "::warning::проверка завершилась с ошибкой, продолжаю"
            if [ -f state/seen.json ]; then
              git add state/seen.json docs/leads.json
              if ! git diff --cached --quiet; then
                git commit -q -m "state: просмотренные посты"
                git pull -q --rebase || { git rebase --abort; echo "::warning::не удалось подтянуть изменения"; }
                git push -q || echo "::warning::не удалось отправить изменения"
              fi
            fi
            echo "::endgroup::"
            [ $(( $(date +%s) + 1800 )) -lt "$end" ] || break
            sleep 1800
          done
      - name: Запустить следующий круг
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch-channels -R "${{ github.repository }}" --ref main
